name: Publish RegExr Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/regexr
          IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')

          EXISTING_TAG=$(git tag --points-at "$GITHUB_SHA" --sort=-v:refname | sed -n -E '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sed -n '1p')
          LATEST_TAG=$(git tag --sort=-v:refname | sed -n -E '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | sed -n '1p')

          if [ -n "$EXISTING_TAG" ]; then
            VERSION=$EXISTING_TAG
            PREVIOUS_TAG=$(git tag --sort=-v:refname | sed -n -E '/^v[0-9]+\.[0-9]+\.[0-9]+$/p' | grep -Fxv "$VERSION" | sed -n '1p' || true)
          elif [ -n "$LATEST_TAG" ]; then
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            VERSION="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            PREVIOUS_TAG=$LATEST_TAG
          else
            VERSION=v1.0.0
            PREVIOUS_TAG=
          fi

          SHORT_SHA=${GITHUB_SHA::7}
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "previous=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${IMAGE}:${VERSION},${IMAGE}:${SHORT_SHA},${IMAGE}:latest" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          tag_name: ${{ steps.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          previous_tag: ${{ steps.meta.outputs.previous }}

  deploy:
    name: Deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    uses: wajeht/docker-cd-deploy-workflow/.github/workflows/deploy.yaml@970a4d7bd568e096d091fbec3371019c763def1f # v0.0.26
    with:
      app-path: apps/regexr
      service-name: regexr
      tag: ${{ needs.release.outputs.version }}
      url: https://regex.jaw.dev
    secrets:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
